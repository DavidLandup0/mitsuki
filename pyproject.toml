[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsuki"
version = "0.3.0"
description = "Python web framework with a Spring Boot-style programming model: dependency injection, layered components and convention over configuration, with Python's productivity."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "David Landup"}
]
license = "Apache-2.0"
keywords = ["web", "framework", "python", "asgi", "dependency-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "uvicorn>=0.24.0",
    "starlette>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "granian>=1.0.0",
    "socketify>=0.0.27",
    "python-multipart>=0.0.20",
    "colorama>=0.4.6",
    "croniter>=2.0.0",
    "pytz>=2021.1",
    "msgspec>=0.19.0",
]

[project.optional-dependencies]
postgresql = ["asyncpg>=0.29.0"]
metrics = ["psutil>=5.9.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.0",
    "httpx>=0.25.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "testcontainers>=4.14.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/DavidLandup0/mitsuki"
Documentation = "https://github.com/DavidLandup0/mitsuki/blob/main/README.md"
Repository = "https://github.com/DavidLandup0/mitsuki"
Issues = "https://github.com/DavidLandup0/mitsuki/issues"

[project.scripts]
mitsuki = "mitsuki.cli.bootstrap:main"

[tool.setuptools]
packages = ["mitsuki", "mitsuki.core", "mitsuki.web", "mitsuki.data", "mitsuki.data.adapters", "mitsuki.config", "mitsuki.cli", "mitsuki.openapi", "mitsuki.grafana"]

[tool.setuptools.package-data]
"mitsuki.cli" = ["templates/*.tpl"]
"mitsuki.config" = ["defaults.yml"]
"mitsuki.grafana" = ["*.json"]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
    "psutil>=5.9.0",
]

[tool.ruff]
exclude = [
    "examples",
    "benchmarks",
]

[tool.coverage.run]
source = ["mitsuki"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]